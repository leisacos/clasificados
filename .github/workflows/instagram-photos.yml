name: Download Instagram photos

# Downloads any photo listed in content/instagram/media.json that isn't saved yet
# and commits it. Runs whenever the daily sync updates media.json, once a day as
# a safety net, and on demand from the Actions tab.
on:
  push:
    paths:
      - content/instagram/media.json
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-photos.js
      - name: Commit new photos
        run: |
          git add content/images/instagram
          if git diff --cached --quiet; then
            echo "No new photos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Instagram photos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
